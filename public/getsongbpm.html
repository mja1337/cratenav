<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="cratenav acknowledgement and backlink for the GetSongBPM music-data service."
    />
    <title>GetSongBPM acknowledgement — cratenav</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d10;
        color: #f3f5f7;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 2rem));
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        color: #a7b0ba;
        font-size: 1.05rem;
        line-height: 1.65;
      }

      a {
        color: #20d7ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Thank you, GetSongBPM.</h1>
      <p>
        cratenav can use BPM and key metadata supplied by
        <a href="https://getsongbpm.com/">GetSongBPM</a>. Huge thanks to their
        team for providing an awesome music-data service and API for projects
        like ours.
      </p>
      <p>
        <a href="./">Return to cratenav</a>
        ·
        <a href="https://getsongbpm.com/api">GetSongBPM API</a>
      </p>
    </main>
  </body>
</html>
